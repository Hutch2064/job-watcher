name: Daily job watch
on:
  schedule:
    - cron: '23 12 * * *'
    - cron: '23 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: daily-job-watch
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python watcher.py collect
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw data/history.csv data/status.json data/feed.xml
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git pull --rebase origin main
          git push
      # Commits made with GITHUB_TOKEN do not trigger push workflows.
      - run: gh workflow run test.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python issues.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
